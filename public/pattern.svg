<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Star top-left -->
  <g transform="translate(30,30)" opacity="0.55">
    <path d="M0,-14 L3.3,-4.5 L13.3,-4.3 L5.4,1.7 L8.2,11.8 L0,6.2 L-8.2,11.8 L-5.4,1.7 L-13.3,-4.3 L-3.3,-4.5 Z" fill="#FF1F8E"/>
    <circle r="3.5" fill="none" stroke="#FF1F8E" stroke-width="1"/>
  </g>

  <!-- Flower top-right -->
  <g transform="translate(165,40)" opacity="0.45">
    <circle r="5" fill="none" stroke="#00CFFF" stroke-width="1.2"/>
    <circle cx="0" cy="-10" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
    <circle cx="9.5" cy="-5" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
    <circle cx="9.5" cy="5" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
    <circle cx="0" cy="10" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
    <circle cx="-9.5" cy="5" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
    <circle cx="-9.5" cy="-5" r="4" fill="none" stroke="#00CFFF" stroke-width="1"/>
  </g>

  <!-- Star bottom-right -->
  <g transform="translate(170,165)" opacity="0.50">
    <path d="M0,-14 L3.3,-4.5 L13.3,-4.3 L5.4,1.7 L8.2,11.8 L0,6.2 L-8.2,11.8 L-5.4,1.7 L-13.3,-4.3 L-3.3,-4.5 Z" fill="#FF6B1A"/>
    <circle r="3.5" fill="none" stroke="#FF6B1A" stroke-width="1"/>
  </g>

  <!-- Flower bottom-left -->
  <g transform="translate(38,168)" opacity="0.40">
    <circle r="4.5" fill="none" stroke="#8B2FC9" stroke-width="1.2"/>
    <circle cx="0" cy="-9" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
    <circle cx="8.5" cy="-4.5" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
    <circle cx="8.5" cy="4.5" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
    <circle cx="0" cy="9" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
    <circle cx="-8.5" cy="4.5" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
    <circle cx="-8.5" cy="-4.5" r="3.5" fill="none" stroke="#8B2FC9" stroke-width="1"/>
  </g>

  <!-- Center small star -->
  <g transform="translate(100,100)" opacity="0.30">
    <path d="M0,-9 L2.1,-2.9 L8.6,-2.8 L3.5,1.1 L5.3,7.6 L0,4 L-5.3,7.6 L-3.5,1.1 L-8.6,-2.8 L-2.1,-2.9 Z" fill="#00CFFF"/>
  </g>

  <!-- Bracket corners — TL -->
  <path d="M10,22 L10,10 L22,10" fill="none" stroke="#FF1F8E" stroke-width="1.2" opacity="0.30"/>
  <!-- Bracket corners — TR -->
  <path d="M178,22 L178,10 L166,10" fill="none" stroke="#00CFFF" stroke-width="1.2" opacity="0.30"/>
  <!-- Bracket corners — BL -->
  <path d="M10,178 L10,190 L22,190" fill="none" stroke="#FF6B1A" stroke-width="1.2" opacity="0.30"/>
  <!-- Bracket corners — BR -->
  <path d="M178,178 L178,190 L166,190" fill="none" stroke="#8B2FC9" stroke-width="1.2" opacity="0.30"/>

  <!-- Scattered dots -->
  <circle cx="100" cy="30"  r="2.5" fill="#FF1F8E" opacity="0.35"/>
  <circle cx="60"  cy="100" r="2"   fill="#00CFFF" opacity="0.30"/>
  <circle cx="140" cy="100" r="2"   fill="#FF6B1A" opacity="0.30"/>
  <circle cx="100" cy="170" r="2.5" fill="#8B2FC9" opacity="0.35"/>
  <circle cx="55"  cy="55"  r="1.8" fill="#AAFF2D" opacity="0.28"/>
  <circle cx="145" cy="55"  r="1.8" fill="#FF1F8E" opacity="0.28"/>
  <circle cx="55"  cy="145" r="1.8" fill="#00CFFF" opacity="0.28"/>
  <circle cx="145" cy="145" r="1.8" fill="#FF6B1A" opacity="0.28"/>

  <!-- Horizontal dash lines -->
  <line x1="70" y1="100" x2="85" y2="100" stroke="#00CFFF" stroke-width="1" opacity="0.20" stroke-dasharray="3,3"/>
  <line x1="115" y1="100" x2="130" y2="100" stroke="#FF1F8E" stroke-width="1" opacity="0.20" stroke-dasharray="3,3"/>
</svg>
